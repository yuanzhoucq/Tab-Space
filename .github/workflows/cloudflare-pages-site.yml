name: Deploy Marketing Site to Cloudflare Pages

on:
  push:
    paths:
      - '*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'assets/**'
      - 'share/**'
      - 'icon.png'
      - '_headers'
      - '_redirects'
      - '.github/workflows/cloudflare-pages-site.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v6

      # The site is plain static HTML with no build step. Assemble an explicit
      # allowlist rather than deploying the repository root, so the Admin
      # dashboard, workflows, and agent docs can never leak into the site.
      - name: Assemble site
        run: |
          mkdir -p dist
          cp ./*.html icon.png robots.txt sitemap.xml _headers _redirects dist/
          cp -R assets dist/assets
          cp -R share dist/share
          find dist -name '.DS_Store' -delete

      - name: Verify the deploy contains only site files
        run: |
          for unexpected in admin .github .claude CLAUDE.md AGENTS.md README.md CNAME; do
            if [ -e "dist/$unexpected" ]; then
              echo "Refusing to deploy: dist/$unexpected should not be published" >&2
              exit 1
            fi
          done
          for required in index.html index-zh.html switcher.html privacy.html changelog.html redirect.html storage.html manage-tabs-across-browsers-mac.html tab-space-vs-onetab.html tab-space-vs-safari-tab-groups.html robots.txt sitemap.xml 404.html _headers _redirects assets/css/main.css assets/css/home-v2.css assets/css/compare-v2.css assets/css/switcher.css assets/tab-space-switcher-film.mp4 assets/img/switcher-demo-poster.webp assets/img/switcher-4-1.webp assets/img/multi-browser-workspace.webp assets/img/tab-space-social.webp share/index.html share/share.css share/share.js share/app-icon.png; do
            if [ ! -e "dist/$required" ]; then
              echo "Refusing to deploy: dist/$required is missing" >&2
              exit 1
            fi
          done
          if ! grep -Eq '^/s/:id[[:space:]]+/share/[[:space:]]+200$' dist/_redirects; then
            echo "Refusing to deploy: the canonical /s/:id share rewrite is missing" >&2
            exit 1
          fi
          if ! grep -Fq "img-src 'self' https://t2.gstatic.com" dist/_headers; then
            echo "Refusing to deploy: the share viewer favicon CSP is missing" >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tab-space-site --branch=${{ github.ref_name }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
