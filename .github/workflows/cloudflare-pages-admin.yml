name: Deploy Admin Dashboard to Cloudflare Pages

on:
  push:
    paths:
      - 'admin/**'
      - '.github/workflows/cloudflare-pages-admin.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: admin/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install test browser
        run: yarn playwright install --with-deps chromium

      - name: Lint
        run: yarn lint

      - name: Build and validate translations
        run: VUE_APP_BUILD_SHA=$GITHUB_SHA VUE_APP_BUILD_TIME=$(date -u +%Y-%m-%d) yarn build

      - name: Run browser tests
        run: yarn test:e2e

      - name: Deploy tested build to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy admin/dist --project-name=tab-space-admin --branch=${{ github.ref_name }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
